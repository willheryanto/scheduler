name: Claude scheduled hello (token refresh)

on:
  schedule:
    # GitHub cron uses UTC. Deadlines: 06/11/16/21 GMT+7. Scheduled ~3h20m early
    # because GitHub scheduled runs have been observed up to ~3h27m late.
    # Primary: 02:40 / 07:40 / 12:40 / 17:40 GMT+7
    - cron: "40 19,0,5,10 * * *"
    # Backup (+45m): 03:25 / 08:25 / 13:25 / 18:25 GMT+7
    - cron: "25 20,1,6,11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: claude-scheduled-hello
  cancel-in-progress: false

jobs:
  hello:
    # Codex ping disabled; only the Claude ping runs. Remove this line to re-enable.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional: set this secret (PAT) if GITHUB_TOKEN can't write secrets in your repo.
      # Required scopes depend on repo settings; start with classic PAT "repo".
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

      # Set this secret in repo settings.
      # Expected to contain the full JSON from ~/.codex/auth.json.
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

      # Optional: override where Codex auth is read/written.
      # Recommended to set as a repository variable.
      CODEX_AUTH_PATH: ${{ vars.CODEX_AUTH_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest

      - name: Prepare Codex auth
        id: codex_prepare
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CODEX_AUTH_JSON:-}" ]]; then
            echo "Missing required secret: CODEX_AUTH_JSON" >&2
            exit 1
          fi

          auth_path="${CODEX_AUTH_PATH:-$HOME/.codex/auth.json}"
          mkdir -p "$(dirname "$auth_path")"
          printf '%s' "$CODEX_AUTH_JSON" > "$auth_path"
          chmod 600 "$auth_path" || true

          # Pre-trust the workspace so the TUI doesn't stop at the folder trust prompt.
          codex_home="${CODEX_HOME:-$HOME/.codex}"
          mkdir -p "$codex_home"
          printf '\n[projects."%s"]\ntrust_level = "trusted"\n' "$GITHUB_WORKSPACE" >> "$codex_home/config.toml"

          old_tokens_path="${RUNNER_TEMP}/codex-old-tokens.json"
          node - <<'NODE' "$auth_path" "$old_tokens_path"
          const fs = require("fs");
          const [authPath, outPath] = process.argv.slice(2);
          const j = JSON.parse(fs.readFileSync(authPath, "utf8"));
          const access = String(j?.tokens?.access_token ?? "").trim();
          const refresh = String(j?.tokens?.refresh_token ?? "").trim();
          fs.writeFileSync(outPath, JSON.stringify({ access, refresh }));
          NODE
          chmod 600 "$old_tokens_path" || true

          {
            echo "auth_path=$auth_path"
            echo "old_tokens_path=$old_tokens_path"
          } >> "$GITHUB_OUTPUT"

      - name: Ping Codex
        shell: bash
        env:
          CODEX_AUTH_PATH: ${{ steps.codex_prepare.outputs.auth_path }}
        run: |
          set -euo pipefail

          tui_log_path="${RUNNER_TEMP}/codex-tui.log"
          sessions_dir="${CODEX_HOME:-$HOME/.codex}/sessions"
          start_marker="${RUNNER_TEMP}/codex-ping-start"
          touch "$start_marker"

          # Start an interactive session with a ping, then request usage before quitting.
          set +e
          ( sleep 20; printf '/usage\n'; sleep 5; printf '/quit\n' ) | timeout 60s env TERM=xterm-256color script -q -e -c 'stty rows 40 cols 120; codex --no-alt-screen --model gpt-6-luna -c model_reasoning_effort=low --sandbox workspace-write --ask-for-approval never "ping"' /dev/null | tee "$tui_log_path"
          status="${PIPESTATUS[1]}"
          set -e

          node - <<'NODE' "$tui_log_path" "$sessions_dir" "$start_marker"
          const fs = require("fs");
          const path = require("path");
          const [logPath, sessionsDir, startMarker] = process.argv.slice(2);
          const raw = fs.readFileSync(logPath, "utf8");
          const stripped = raw
            .replace(/\x1b\[[0-?]*[ -/]*[@-~]/g, "")
            .replace(/\x1b\][^\x07]*(?:\x07|\x1b\\)/g, "")
            .replace(/\x1b[()][A-Za-z0-9]/g, "")
            .replace(/[\x00-\x08\x0b-\x1f\x7f]/g, "");
          const compact = stripped.toLowerCase().replace(/\s+/g, "");
          const authFailures = [
            "accesstokencouldnotberefreshed",
            "refreshtokenwasalreadyused",
            "refreshtokenhasexpired",
            "refreshtokenwasrevoked",
            "pleaselogoutandsigninagain",
            "pleaselogoutandsigningagain",
            "notauthenticated",
            "authenticationrequired",
            "account/readfailed",
            "unauthorized",
          ];

          const matched = authFailures.find((needle) => compact.includes(needle));
          if (matched) {
            console.error(`Codex TUI auth failure detected: ${matched}`);
            process.exit(1);
          }

          // The TUI output isn't readable in CI, so confirm the model replied via the session rollout.
          const since = fs.statSync(startMarker).mtimeMs;
          const rollouts = [];
          const walk = (dir) => {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p);
              else if (/^rollout-.*\.jsonl$/.test(entry.name) && fs.statSync(p).mtimeMs >= since) rollouts.push(p);
            }
          };
          walk(sessionsDir);

          let reply = "";
          let rateLimits = null;
          for (const file of rollouts) {
            for (const line of fs.readFileSync(file, "utf8").split("\n")) {
              let j;
              try { j = JSON.parse(line); } catch { continue; }
              const p = j?.payload;
              if (j?.type === "response_item" && p?.type === "message" && p?.role === "assistant") {
                const text = (p.content ?? []).map((c) => c?.text ?? "").join("").trim();
                if (text) reply = text;
              }
              if (j?.type === "event_msg" && p?.type === "token_count" && p?.rate_limits) rateLimits = p.rate_limits;
            }
          }

          if (!reply) {
            console.error(`No Codex model reply found in session rollouts under ${sessionsDir} (${rollouts.length} file(s) checked).`);
            process.exit(1);
          }
          console.log(`Codex replied: ${reply.slice(0, 200)}`);
          if (rateLimits) console.log(`Codex rate limits: ${JSON.stringify(rateLimits)}`);
          NODE

          if [[ "$status" -eq 124 ]]; then
            echo "Codex TUI ping timed out after invocation; continuing."
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

      - name: Update secret - CODEX_AUTH_JSON
        # Save rotated tokens even if the ping check fails, so the secret never goes stale.
        if: always() && steps.codex_prepare.outcome == 'success'
        shell: bash
        env:
          CODEX_AUTH_PATH: ${{ steps.codex_prepare.outputs.auth_path }}
          CODEX_OLD_TOKENS_PATH: ${{ steps.codex_prepare.outputs.old_tokens_path }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "Missing required CLI: gh (GitHub CLI)" >&2
            exit 1
          fi

          auth_path="${CODEX_AUTH_PATH:?Missing CODEX_AUTH_PATH}"
          old_tokens_path="${CODEX_OLD_TOKENS_PATH:?Missing CODEX_OLD_TOKENS_PATH}"

          if [[ ! -f "$auth_path" ]]; then
            echo "Codex auth file not found after running codex: $auth_path" >&2
            exit 1
          fi

          if [[ ! -f "$old_tokens_path" ]]; then
            echo "Codex old tokens file not found: $old_tokens_path" >&2
            exit 1
          fi

          old_access="$(
            node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              process.stdout.write(String(j?.access ?? "").trim());
            ' "$old_tokens_path"
          )"
          old_refresh="$(
            node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              process.stdout.write(String(j?.refresh ?? "").trim());
            ' "$old_tokens_path"
          )"

          new_access="$(
            node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              process.stdout.write((j?.tokens?.access_token ?? "").trim());
            ' "$auth_path"
          )"
          new_refresh="$(
            node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              process.stdout.write((j?.tokens?.refresh_token ?? "").trim());
            ' "$auth_path"
          )"

          if [[ -z "$new_access" || -z "$new_refresh" ]]; then
            echo "Could not read access/refresh tokens from $auth_path" >&2
            exit 1
          fi

          if [[ "$new_access" == "$old_access" && "$new_refresh" == "$old_refresh" ]]; then
            echo "Codex tokens unchanged; skipping secret update."
            exit 0
          fi

          gh secret set CODEX_AUTH_JSON -R "$GITHUB_REPOSITORY" < "$auth_path"
          echo "Updated repo secret: CODEX_AUTH_JSON"

  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Set this secret in repo settings.
      # Expected to contain the long-lived token printed by `claude setup-token`.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Ping Claude
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "Missing required secret: CLAUDE_CODE_OAUTH_TOKEN" >&2
            exit 1
          fi

          result_path="${RUNNER_TEMP}/claude-result.json"

          set +e
          timeout 120s claude -p --model haiku --output-format json "ping" > "$result_path"
          status=$?
          set -e

          node - <<'NODE' "$result_path" "$status"
          const fs = require("fs");
          const [resultPath, status] = process.argv.slice(2);
          const raw = fs.readFileSync(resultPath, "utf8");
          let j;
          try {
            j = JSON.parse(raw);
          } catch {
            console.error(`Claude returned non-JSON output (exit ${status}): ${raw.slice(0, 500)}`);
            process.exit(1);
          }

          const reply = String(j?.result ?? "").trim();
          if (j?.is_error || j?.subtype !== "success" || !reply) {
            console.error(`Claude ping failed (exit ${status}): ${JSON.stringify({ subtype: j?.subtype, api_error_status: j?.api_error_status, result: reply.slice(0, 500) })}`);
            process.exit(1);
          }
          console.log(`Claude replied: ${reply.slice(0, 200)}`);
          NODE
