name: Claude scheduled hello (token refresh)

on:
  schedule:
    # GitHub cron uses UTC. Target actual fires ~06/11/16 GMT+7.
    # Primary: 22:33, 01:33, 06:33 UTC. Backup (+1h): 02:33, 07:33 UTC.
    - cron: "33 22,1,2,6,7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: claude-scheduled-hello
  cancel-in-progress: false

jobs:
  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional: set this secret (PAT) if GITHUB_TOKEN can't write secrets in your repo.
      # Required scopes depend on repo settings; start with classic PAT "repo".
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

      # Set this secret in repo settings.
      # Expected to contain the full JSON from ~/.codex/auth.json.
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

      # Optional: override where Codex auth is read/written.
      # Recommended to set as a repository variable.
      CODEX_AUTH_PATH: ${{ vars.CODEX_AUTH_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest

      - name: Prepare Codex auth
        id: codex_prepare
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CODEX_AUTH_JSON:-}" ]]; then
            echo "Missing required secret: CODEX_AUTH_JSON" >&2
            exit 1
          fi

          auth_path="${CODEX_AUTH_PATH:-$HOME/.codex/auth.json}"
          mkdir -p "$(dirname "$auth_path")"
          printf '%s' "$CODEX_AUTH_JSON" > "$auth_path"
          chmod 600 "$auth_path" || true

          old_tokens_path="${RUNNER_TEMP}/codex-old-tokens.json"
          node - <<'NODE' "$auth_path" "$old_tokens_path"
          const fs = require("fs");
          const [authPath, outPath] = process.argv.slice(2);
          const j = JSON.parse(fs.readFileSync(authPath, "utf8"));
          const access = String(j?.tokens?.access_token ?? "").trim();
          const refresh = String(j?.tokens?.refresh_token ?? "").trim();
          fs.writeFileSync(outPath, JSON.stringify({ access, refresh }));
          NODE
          chmod 600 "$old_tokens_path" || true

          {
            echo "auth_path=$auth_path"
            echo "old_tokens_path=$old_tokens_path"
          } >> "$GITHUB_OUTPUT"

      - name: Ping Codex
        shell: bash
        env:
          CODEX_AUTH_PATH: ${{ steps.codex_prepare.outputs.auth_path }}
        run: |
          set -euo pipefail

          print_codex_usage() {
            local label="$1"
          local out_path="$2"
          node - <<'NODE' "$CODEX_AUTH_PATH" "$label" "$out_path"
          const fs = require("fs");
          const https = require("https");

          const [authPath, label, outPath] = process.argv.slice(2);
          const auth = JSON.parse(fs.readFileSync(authPath, "utf8"));
          const tokens = auth.tokens || {};
          const accessToken = String(tokens.access_token || "").trim();
          const accountId = String(tokens.account_id || "").trim();

          if (!accessToken) {
            throw new Error("missing Codex access token");
          }

          const headers = {
            Authorization: `Bearer ${accessToken}`,
            "User-Agent": "codex-cli",
          };
          if (accountId) {
            headers["ChatGPT-Account-Id"] = accountId;
          }

          const req = https.request(
            "https://chatgpt.com/backend-api/wham/usage",
            { method: "GET", headers },
            (res) => {
              let body = "";
              res.setEncoding("utf8");
              res.on("data", (chunk) => { body += chunk; });
              res.on("end", () => {
                if (res.statusCode < 200 || res.statusCode >= 300) {
                  console.error(`codex usage ${label}: request failed status=${res.statusCode}`);
                  process.exit(1);
                }

                const payload = JSON.parse(body);
                const primary = payload.rate_limit?.primary_window ?? null;
                const secondary = payload.rate_limit?.secondary_window ?? null;
                const printWindow = (name, window) => {
                  if (!window) {
                    console.log(`codex usage ${label} ${name}: unavailable`);
                    return;
                  }

                  const resetAt = window.reset_at ?? null;
                  const resetIso = resetAt ? new Date(resetAt * 1000).toISOString() : "";
                  console.log(
                    `codex usage ${label} ${name}: used_percent=${window.used_percent ?? ""} ` +
                    `window_seconds=${window.limit_window_seconds ?? ""} ` +
                    `reset_at=${resetAt ?? ""} reset_utc=${resetIso}`,
                  );
                };

                printWindow("primary", primary);
                printWindow("secondary", secondary);
                fs.writeFileSync(outPath, JSON.stringify({
                  primary_reset_at: primary?.reset_at ?? null,
                  primary_used_percent: primary?.used_percent ?? null,
                  secondary_reset_at: secondary?.reset_at ?? null,
                  secondary_used_percent: secondary?.used_percent ?? null,
                }));
              });
            },
          );
          req.on("error", (error) => {
            console.error(`codex usage ${label}: request failed ${error.message}`);
            process.exit(1);
          });
          req.end();
          NODE
          }

          before_usage_path="${RUNNER_TEMP}/codex-usage-before.json"
          after_usage_path="${RUNNER_TEMP}/codex-usage-after.json"
          tui_log_path="${RUNNER_TEMP}/codex-tui.log"

          print_codex_usage "before" "$before_usage_path"

          # Run the interactive CLI path under a pseudo-TTY. This more closely matches normal
          # local Codex usage than `codex exec`, while the timeout prevents CI hangs.
          set +e
          ( sleep 20; printf '/quit\n' ) | timeout 45s script -q -e -c 'codex --no-alt-screen --model gpt-5.5 --sandbox workspace-write --ask-for-approval never "hello"' /dev/null | tee "$tui_log_path"
          status="${PIPESTATUS[1]}"
          set -e

          node - <<'NODE' "$tui_log_path"
          const fs = require("fs");
          const logPath = process.argv[2];
          const raw = fs.readFileSync(logPath, "utf8");
          const stripped = raw
            .replace(/\x1b\[[0-?]*[ -/]*[@-~]/g, "")
            .replace(/\x1b\][^\x07]*(?:\x07|\x1b\\)/g, "")
            .replace(/\x1b[()][A-Za-z0-9]/g, "")
            .replace(/[\x00-\x08\x0b-\x1f\x7f]/g, "");
          const compact = stripped.toLowerCase().replace(/\s+/g, "");
          const authFailures = [
            "accesstokencouldnotberefreshed",
            "refreshtokenwasalreadyused",
            "refreshtokenhasexpired",
            "refreshtokenwasrevoked",
            "pleaselogoutandsigninagain",
            "pleaselogoutandsigningagain",
            "notauthenticated",
            "authenticationrequired",
          ];

          const matched = authFailures.find((needle) => compact.includes(needle));
          if (matched) {
            console.error(`Codex TUI auth failure detected: ${matched}`);
            process.exit(1);
          }
          NODE

          if [[ "$status" -eq 124 ]]; then
            echo "Codex TUI ping timed out after invocation; continuing."
          elif [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi

          print_codex_usage "after" "$after_usage_path"

          node - <<'NODE' "$before_usage_path" "$after_usage_path"
          const fs = require("fs");
          const [beforePath, afterPath] = process.argv.slice(2);
          const before = JSON.parse(fs.readFileSync(beforePath, "utf8"));
          const after = JSON.parse(fs.readFileSync(afterPath, "utf8"));

          if (before.primary_reset_at === after.primary_reset_at) {
            console.log(
              `Codex primary reset_at unchanged after ping: ${before.primary_reset_at}`,
            );
            process.exit(0);
          }

          console.log(
            `Codex primary reset_at changed: ${before.primary_reset_at} -> ${after.primary_reset_at}`,
          );
          NODE

      - name: Update secret - CODEX_AUTH_JSON
        shell: bash
        env:
          CODEX_AUTH_PATH: ${{ steps.codex_prepare.outputs.auth_path }}
          CODEX_OLD_TOKENS_PATH: ${{ steps.codex_prepare.outputs.old_tokens_path }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "Missing required CLI: gh (GitHub CLI)" >&2
            exit 1
          fi

          auth_path="${CODEX_AUTH_PATH:?Missing CODEX_AUTH_PATH}"
          old_tokens_path="${CODEX_OLD_TOKENS_PATH:?Missing CODEX_OLD_TOKENS_PATH}"

          if [[ ! -f "$auth_path" ]]; then
            echo "Codex auth file not found after running codex: $auth_path" >&2
            exit 1
          fi

          if [[ ! -f "$old_tokens_path" ]]; then
            echo "Codex old tokens file not found: $old_tokens_path" >&2
            exit 1
          fi

          old_access="$(
            node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              process.stdout.write(String(j?.access ?? "").trim());
            ' "$old_tokens_path"
          )"
          old_refresh="$(
            node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              process.stdout.write(String(j?.refresh ?? "").trim());
            ' "$old_tokens_path"
          )"

          new_access="$(
            node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              process.stdout.write((j?.tokens?.access_token ?? "").trim());
            ' "$auth_path"
          )"
          new_refresh="$(
            node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              process.stdout.write((j?.tokens?.refresh_token ?? "").trim());
            ' "$auth_path"
          )"

          if [[ -z "$new_access" || -z "$new_refresh" ]]; then
            echo "Could not read access/refresh tokens from $auth_path" >&2
            exit 1
          fi

          if [[ "$new_access" == "$old_access" && "$new_refresh" == "$old_refresh" ]]; then
            echo "Codex tokens unchanged; skipping secret update."
            exit 0
          fi

          gh secret set CODEX_AUTH_JSON -R "$GITHUB_REPOSITORY" < "$auth_path"
          echo "Updated repo secret: CODEX_AUTH_JSON"
